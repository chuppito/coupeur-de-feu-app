name: V4 validation
on:
  push:
    branches: [V4]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v4-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Résolution verrouillée
        run: flutter pub get --enforce-lockfile
      - name: Analyse du nouveau moteur et de son intégration
        run: flutter analyze --no-pub lib/v4 test/v4 lib/widgets/interactive_body.dart test/widget_test.dart
      - name: Tests complets
        run: flutter test --no-pub --reporter expanded
      - name: Compilation Android de vérification
        run: flutter build apk --debug --no-pub
      - uses: actions/upload-artifact@v4
        with:
          name: magnetisme-v4-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
