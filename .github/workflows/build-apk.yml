name: Build APK

on:
  push:
    branches: [ main, v2-magnetisme-guide ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4
      - name: Installation du JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Installation de Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Récupération des dépendances
        run: flutter pub get
      - name: Compilation de l'APK (release)
        run: flutter build apk --release
      - name: Publication en tant qu'artefact du run
        uses: actions/upload-artifact@v4
        with:
          name: coupeur-de-feu-apk
          path: build/app/outputs/flutter-apk/app-release.apk
