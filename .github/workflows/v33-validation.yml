name: V3.3.1 - Tests et APK
on:
  push:
    branches: [V3.3.1]
  workflow_dispatch:
concurrency:
  group: v33-validation-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: Analyse statique (erreurs bloquantes)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Tests de parcours, minuteurs et sauvegarde
        timeout-minutes: 4
        run: flutter test --reporter expanded
      - name: APK release
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Magnetisme-V3.3.1-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
